# No non-free dependencies, no proprietary SDKs, no tracking libraries.
# Network: public NOAA/NWS/USGS/OSM/Open-Meteo HTTPS APIs only.
# AntiFeatures: none expected (UpstreamNonFree not applicable).

Description: |-
    U.S. National Weather Service point forecasts for Android — clear,
    offline-friendly, and free software.

    Features:
    * Current conditions and multi-day NWS forecast
    * Hourly tables (temperature, precip, wind, tides, air quality, space weather, …)
    * Watches, warnings, and advisories
    * Map picker (osmdroid, no Google Play Services) and city search
    * Sun, moon, space weather, earthquakes, and severe weather summaries
    * Home screen widget with bundled NWS icons

    Privacy:
    * No accounts, ads, or analytics
    * Location only when you choose GPS / map
    * Data stored only on device; HTTPS to public weather APIs

    Not affiliated with NOAA or NWS. Uses public data only.

Summary: NWS point forecasts, maps, and hazards — FOSS, no tracking
